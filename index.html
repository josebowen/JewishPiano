<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewish Piano Archive - Restored Complete Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1e293b;
            --secondary: #b45309;
            --accent: #0f172a;
            --light: #f8fafc;
            --border: #cbd5e1;
        }

        body { font-family: 'Lato', sans-serif; background: var(--light); color: var(--accent); margin: 0; padding: 0; line-height: 1.6; }

        /* HEADER */
        header { background: var(--primary); color: white; padding: 2.5rem 1rem; text-align: center; border-bottom: 5px solid var(--secondary); }
        h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; margin: 0; }
        .subtitle { font-size: 1rem; opacity: 0.85; margin-top: 0.5rem; }

        /* NAV BUTTONS */
        .view-switcher { background: white; padding: 1rem; display: flex; justify-content: center; gap: 1rem; position: sticky; top: 0; z-index: 200; border-bottom: 1px solid var(--border); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-btn { padding: 0.6rem 1.2rem; border: 2px solid var(--primary); background: transparent; color: var(--primary); font-weight: bold; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        .nav-btn.active { background: var(--primary); color: white; }
        .nav-btn:hover { background: var(--secondary); color: white; border-color: var(--secondary); }

        /* SECTIONS */
        .view-section { display: none; max-width: 1400px; margin: 2rem auto; padding: 0 1rem; }
        .view-section.active { display: block; }

        /* MAP VIEW */
        #map-container { text-align: center; background: white; padding: 2rem; border-radius: 12px; border: 1px solid var(--border); }
        .simple-map { width: 100%; max-width: 900px; margin: 0 auto; fill: white; stroke: #333; stroke-width: 1; stroke-linejoin: round; }
        .region { cursor: pointer; transition: fill 0.2s, stroke-width 0.2s; fill: #f1f5f9; stroke: #64748b; }
        .region:hover { fill: var(--secondary); stroke: white; }
        .region.active { fill: var(--primary); stroke: white; }
        .region-label { font-size: 1.4rem; font-weight: bold; margin-bottom: 1rem; color: var(--primary); display: block; }
        .map-text { pointer-events: none; font-size: 14px; fill: #333; font-weight: bold; text-anchor: middle; }

        /* TIMELINE VIEW */
        #timeline-container { background: white; padding: 3rem 1rem; border-radius: 12px; border: 1px solid var(--border); position: relative; min-height: 800px; overflow-x: auto; }
        .timeline-wrapper { min-width: 1200px; position: relative; height: auto; padding-top: 20px; padding-bottom: 50px; }
        .year-axis { position: sticky; top: 0; width: 100%; height: 30px; border-bottom: 2px solid var(--border); display: flex; justify-content: space-between; background: white; z-index: 10; }
        .year-mark { position: absolute; transform: translateX(-50%); font-size: 0.8rem; color: #64748b; top: 5px; }
        .timeline-bar { position: absolute; height: 16px; background: var(--secondary); border-radius: 4px; opacity: 0.8; transition: 0.2s; cursor: pointer; display: flex; align-items: center; }
        .timeline-bar:hover { opacity: 1; filter: brightness(1.2); z-index: 5; }
        .timeline-bar-label { font-size: 0.75rem; font-weight: 700; white-space: nowrap; color: var(--primary); margin-left: 8px; position: absolute; left: 100%; pointer-events: none; }
        /* Alternating label position to prevent overlap logic (simple version) */
        .timeline-bar:nth-child(even) .timeline-bar-label { left: auto; right: 100%; margin-left: 0; margin-right: 8px; text-align: right; }

        /* LIST VIEW */
        .search-bar { margin-bottom: 2rem; width: 100%; max-width: 600px; padding: 0.8rem; border: 2px solid var(--border); border-radius: 6px; font-size: 1rem; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 2rem; }
        .card { background: white; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
        .card-header { padding: 1.2rem; background: #f1f5f9; border-bottom: 1px solid var(--border); }
        .card-name { font-family: 'Playfair Display', serif; font-size: 1.4rem; margin: 0; }
        .card-dates { font-size: 0.85rem; font-weight: bold; color: #64748b; }
        .card-body { padding: 1.2rem; flex: 1; }
        .card-bio { font-size: 0.9rem; color: #475569; margin-bottom: 1rem; font-style: italic; }
        .work-item { padding: 0.6rem 0; border-top: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; }
        .work-title { font-weight: bold; color: var(--primary); }
        .work-btn { font-size: 0.75rem; background: var(--primary); color: white; padding: 3px 8px; text-decoration: none; border-radius: 4px; }
        .work-btn:hover { background: var(--secondary); }

        footer { text-align: center; padding: 3rem; background: var(--primary); color: #94a3b8; font-size: 0.9rem; margin-top: 4rem; }
    </style>
</head>
<body>

<header>
    <h1>The Jewish Piano Archive</h1>
    <div class="subtitle">Restored & Complete Edition &bull; Accurate Links &bull; Interactive Map</div>
</header>

<div class="view-switcher">
    <button class="nav-btn active" onclick="switchView('list', this)">Alphabetical List</button>
    <button class="nav-btn" onclick="switchView('timeline', this)">Historical Timeline</button>
    <button class="nav-btn" onclick="switchView('map', this)">Map by Region</button>
</div>

<!-- LIST VIEW -->
<section id="view-list" class="view-section active">
    <input type="text" class="search-bar" id="searchInput" placeholder="Search composers or works..." oninput="filterList()">
    <div class="grid" id="listGrid"></div>
</section>

<!-- TIMELINE VIEW -->
<section id="view-timeline" class="view-section">
    <div id="timeline-container">
        <div class="timeline-wrapper" id="timelineWrapper">
            <div class="year-axis" id="yearAxis"></div>
            <!-- Bars injected here -->
        </div>
    </div>
</section>

<!-- MAP VIEW -->
<section id="view-map" class="view-section">
    <div id="map-container">
        <span class="region-label" id="regionName">Select a Region</span>
        <!-- Simplified Line Map using SVG Paths -->
        <svg class="simple-map" viewBox="0 0 1000 500">
             <!-- North America -->
             <path class="region" onclick="filterByCountry('USA')" title="USA" d="M50,150 L250,150 L280,300 L50,300 Z" />
             <text x="150" y="225" class="map-text">USA</text>

             <!-- Scandinavia -->
             <path class="region" onclick="filterByRegion(['Denmark', 'Sweden'])" title="Scandinavia" d="M480,50 L550,50 L580,150 L500,150 Z" />
             <text x="530" y="100" class="map-text">Scandinavia</text>

             <!-- UK -->
             <path class="region" onclick="filterByCountry('England')" title="UK" d="M380,120 L440,120 L440,180 L380,180 Z" />
             <text x="410" y="150" class="map-text">UK</text>

             <!-- France -->
             <path class="region" onclick="filterByCountry('France')" title="France" d="M400,200 L480,200 L480,280 L400,280 Z" />
             <text x="440" y="240" class="map-text">France</text>

             <!-- Central Europe (Germany/Austria/Misc) -->
             <path class="region" onclick="filterByRegion(['Germany', 'Austria', 'Misc'])" title="Central Europe" d="M485,160 L580,160 L580,280 L485,280 Z" />
             <text x="532" y="220" class="map-text">Central Europe</text>

             <!-- Poland -->
             <path class="region" onclick="filterByCountry('Poland')" title="Poland" d="M585,160 L650,160 L650,220 L585,220 Z" />
             <text x="618" y="190" class="map-text">Poland</text>

             <!-- Russia -->
             <path class="region" onclick="filterByCountry('Russia')" title="Russia" d="M655,80 L950,80 L950,300 L655,300 Z" />
             <text x="800" y="200" class="map-text">Russia</text>
        </svg>
        <div class="grid" id="mapGrid" style="margin-top:2rem"></div>
    </div>
</section>

<footer>
    <p>Data aggregates from IMSLP and SheetMusicPlus. Final Restored Version 2026.</p>
</footer>

    function switchView(view, btn) {
        document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('view-' + view).classList.add('active');
        btn.classList.add('active');
        if(view === 'timeline') initTimeline();
    }

    function renderList(targetId, data) {
        const grid = document.getElementById(targetId);
        grid.innerHTML = '';
        if(data.length === 0) {
            grid.innerHTML = '<div style="text-align:center; grid-column:1/-1;">No composers found for this selection.</div>';
            return;
        }
        
        data.forEach(c => {
            const works = c.works.map(w => `
                <div class="work-item">
                    <div>
                        <span class="work-title">${w.title}</span><br>
                        <small style="color:#64748b">${w.key} • ${w.dur}</small>
                    </div>
                    <a href="${w.link}" target="_blank" class="work-btn">Sheet Music</a>
                </div>
            `).join('');
            
            grid.innerHTML += `
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-name">${c.name}</h2>
                        <span class="card-dates">${c.birth} – ${c.death} (${c.country})</span>
                    </div>
                    <div class="card-body">
                        <p class="card-bio">${c.bio}</p>
                        ${works}
                    </div>
                </div>
            `;
        });
    }

    function filterList() {
        const val = document.getElementById('searchInput').value.toLowerCase();
        const filtered = composers.filter(c => c.name.toLowerCase().includes(val) || c.bio.toLowerCase().includes(val));
        renderList('listGrid', filtered);
    }

    function filterByCountry(country) {
        document.getElementById('regionName').innerText = "Region: " + country;
        const filtered = composers.filter(c => c.country === country);
        renderList('mapGrid', filtered);
    }

    function filterByRegion(regions) {
        document.getElementById('regionName').innerText = "Region: " + regions.join(', ');
        const filtered = composers.filter(c => regions.includes(c.country));
        renderList('mapGrid', filtered);
    }

    function initTimeline() {
        const wrapper = document.getElementById('timelineWrapper');
        const axis = document.getElementById('yearAxis');
        
        // Clear previous bars but keep axis
        wrapper.querySelectorAll('.timeline-bar').forEach(e => e.remove());
        
        const start = 1790;
        const end = 2005; // Extended to fit Ornstein
        const range = end - start;

        // Draw Axis if empty
        if(axis.innerHTML === '') {
            for(let yr = start; yr <= end; yr += 10) {
                const mark = document.createElement('div');
                mark.className = 'year-mark';
                mark.style.left = ((yr - start) / range * 100) + '%';
                mark.innerText = yr;
                axis.appendChild(mark);
            }
        }

        const sorted = [...composers].sort((a,b) => a.birth - b.birth);
        
        // Simple collision avoidance for vertical spacing
        sorted.forEach((c, i) => {
            const bar = document.createElement('div');
            bar.className = 'timeline-bar';
            
            // Calculate position
            const leftPct = ((c.birth - start) / range * 100);
            const widthPct = ((c.death - c.birth) / range * 100);
            
            bar.style.left = leftPct + '%';
            bar.style.width = widthPct + '%';
            bar.style.top = (40 + (i * 24)) + 'px'; // 24px vertical spacing
            
            // Create label
            const label = document.createElement('span');
            label.className = 'timeline-bar-label';
            label.innerText = c.name;
            
            // Append label to bar
            bar.appendChild(label);
            
            bar.onclick = () => {
                switchView('list', document.querySelectorAll('.nav-btn')[0]);
                document.getElementById('searchInput').value = c.name;
                filterList();
            };
            
            wrapper.appendChild(bar);
        });
        
        // Adjust container height based on number of items
        wrapper.style.height = (80 + (sorted.length * 24)) + 'px';
    }

    // Init
    renderList('listGrid', composers);
</script>
